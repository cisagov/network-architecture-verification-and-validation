# =============================================================================
# STATES: connection state -> description and styling
# Styling fields are omitted when they match the defaults (see script header).
# =============================================================================

[states.OTH]
description = "No SYN seen, just midstream traffic (a “partial connection” that was not later closed)."
fgColor = "FF92D050"
bgColor = "FFC0C0C0"
fontName = "Arial"
fontColor = "FF333333"

[states.REJ]
description = "Connection attempt rejected."
fgColor = "FFFFC000"
bgColor = "FFFF9900"
fontName = "Arial"
fontColor = "FF333333"

[states.RSTO]
description = "Connection established, originator aborted (sent a RST)."
fgColor = "FFFFFF00"
bgColor = "FFFFFF00"
fontName = "Arial"
fontColor = "FF333333"

[states.RSTOS0]
description = "Originator sent a SYN followed by a RST, we never saw a SYN-ACK from the responder."
fgColor = "FFFFC000"
bgColor = "FFFF9900"
fontName = "Arial"
fontColor = "FF333333"

[states.RSTR]
description = "Established, responder aborted."
fgColor = "FFFFFF00"
bgColor = "FFFFFF00"
fontName = "Arial"
fontColor = "FF333333"

[states.RSTRH]
description = "Responder sent a SYN ACK followed by a RST, we never saw a SYN from the (purported) originator."
fgColor = "FFFFC000"
bgColor = "FFFF9900"
fontName = "Arial"
fontColor = "FF333333"

[states.S0]
description = "Connection attempt seen, no reply."
fgColor = "FFFFC000"
bgColor = "FFFF9900"
fontName = "Arial"
fontColor = "FF333333"

[states.S1]
description = "Connection established, not terminated."
fgColor = "FF92D050"
bgColor = "FFC0C0C0"
fontName = "Arial"
fontColor = "FF333333"

[states.S2]
description = "Connection established and close attempt by originator seen (but no reply from responder)."
fgColor = "FFFFFF00"
bgColor = "FFFFFF00"
fontName = "Arial"
fontColor = "FF333333"

[states.S3]
description = "Connection established and close attempt by responder seen (but no reply from originator)."
fgColor = "FFFFFF00"
bgColor = "FFFFFF00"
fontName = "Arial"
fontColor = "FF333333"

[states.SF]
description = "Normal establishment and termination. Note that this is the same symbol as for state S1. You can tell the two apart because for S1 there will not be any byte counts in the summary, while for SF there will be."
fgColor = "FF92D050"
bgColor = "FFC0C0C0"
fontName = "Arial"
fontColor = "FF333333"

[states.SH]
description = "Originator sent a SYN followed by a FIN, we never saw a SYN ACK from the responder (hence the connection was “half” open)."
fgColor = "FFFFC000"
bgColor = "FFFF9900"
fontName = "Arial"
fontColor = "FF333333"

[states.SHR]
description = "Responder sent a SYN ACK followed by a FIN, we never saw a SYN from the originator."
fgColor = "FFFFC000"
bgColor = "FFFF9900"
fontName = "Arial"
fontColor = "FF333333"

